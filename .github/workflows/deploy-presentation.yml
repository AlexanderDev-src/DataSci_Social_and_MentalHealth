# Builds Website_for_presentation/ and publishes it to GitHub Pages.
# Runs when the site or this workflow changes on main, or by hand from the Actions tab.
name: Deploy presentation

on:
  push:
    branches: [main]
    paths:
      - "Website_for_presentation/**"
      - ".github/workflows/deploy-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits instead of cancelling one mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website_for_presentation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website_for_presentation/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm test
      - run: npm run check

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Website_for_presentation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
