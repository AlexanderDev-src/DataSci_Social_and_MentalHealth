[project]
name = "proposal-viz"
version = "0.1.0"
description = "สำรวจข้อมูลและทำกราฟสำหรับเค้าโครงโครงงาน Student Social Media & Mental Health Impact"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
]

[tool.uv]
# ไม่ได้ทำเป็น package ให้ใครติดตั้ง ใช้ pyproject.toml แค่คุมรายการแพ็กเกจอย่างเดียว
package = false
